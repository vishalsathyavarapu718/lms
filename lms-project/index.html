<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in –  kode Learn</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth">
  <div class="auth-brand">
    <div style="font:1.4rem Georgia,serif">kode Learn</div>
    <h1>Learn at your own pace.</h1>
    <small>© 2026 kode Learn</small>
  </div>
  <div class="auth-form">
    <form class="auth-card" action="dashboard.html">
      <h1>Sign in</h1>
      <p class="sub">Use your school email to continue.</p>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="anika@school.edu" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      <div class="row"><label><input type="checkbox"> Keep me signed in</label><a class="sub" href="#"><u>Forgot password?</u></a></div>
      <button class="btn block" type="submit">Sign in</button>
      <p class="links sub">New here? <a href="register.html">Create an account</a></p>
    </form>
  </div>
</div>
</body>
</html>
